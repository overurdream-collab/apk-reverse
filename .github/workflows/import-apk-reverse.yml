name: One-time import of apk-reverse
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-apk-reverse.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned upstream source without executing it
        env:
          SOURCE_SHA: 4aaa586725313b4b58b653df72635925fcad2be1
        run: |
          set -euo pipefail
          git clone --depth 1 --no-checkout https://github.com/newliver666/apk-reverse.git /tmp/apk-reverse-upstream
          git -C /tmp/apk-reverse-upstream fetch --depth 1 origin "$SOURCE_SHA"
          git -C /tmp/apk-reverse-upstream checkout --detach "$SOURCE_SHA"
          test "$(git -C /tmp/apk-reverse-upstream rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /tmp/apk-reverse-upstream/LICENSE
          test -f /tmp/apk-reverse-upstream/skills/apk-reverse/SKILL.md
          rsync -a --exclude='.git' --exclude='.github/workflows/' /tmp/apk-reverse-upstream/ ./
          git add -A
          test "$(git ls-files | wc -l)" -ge 200
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import apk-reverse upstream 4aaa586725313b4b58b653df72635925fcad2be1"
          git push origin HEAD:main
